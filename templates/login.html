<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FarmaControl - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#004395",
                        "on-primary-fixed-variant": "#005236",
                        "surface-tint": "#006c49",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-fixed": "#001a42",
                        "surface-dim": "#cbdbf5",
                        "primary": "#006c49",
                        "on-tertiary-fixed": "#2a1700",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-container": "#e29100",
                        "outline-variant": "#bbcabf",
                        "secondary": "#0058be",
                        "surface-bright": "#f8f9ff",
                        "secondary-fixed": "#d8e2ff",
                        "secondary-container": "#2170e4",
                        "on-surface-variant": "#3c4a42",
                        "background": "#f8f9ff",
                        "on-primary-fixed": "#002113",
                        "inverse-primary": "#4edea3",
                        "error-container": "#ffdad6",
                        "on-surface": "#0b1c30",
                        "error": "#ba1a1a",
                        "surface-container": "#e5eeff",
                        "on-secondary-container": "#fefcff",
                        "surface-container-low": "#eff4ff",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#00422b",
                        "on-background": "#0b1c30",
                        "primary-fixed-dim": "#4edea3",
                        "on-tertiary-fixed-variant": "#653e00",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-tertiary-container": "#523200",
                        "on-error": "#ffffff",
                        "primary-fixed": "#6ffbbe",
                        "tertiary": "#855300",
                        "surface-container-highest": "#d3e4fe",
                        "inverse-surface": "#213145",
                        "surface-variant": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "surface": "#f8f9ff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "primary-container": "#10b981",
                        "outline": "#6c7a71",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "stack-md": "1rem",
                        "section-padding": "2rem",
                        "gutter": "1.5rem",
                        "stack-sm": "0.5rem",
                        "stack-lg": "2rem"
                    },
                    "fontFamily": {
                        "mono-data": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "mono-data": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-surface-variant via-surface to-surface-container-high min-h-screen flex items-center justify-center p-gutter">
<div class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-[1.5rem] border border-white/60 shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] p-section-padding overflow-hidden relative">
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-primary/10 to-primary/30 text-primary mb-stack-md shadow-inner">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-sm">FarmaControl</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Acceso al sistema de gestión</p>
</div>
{% if error %}
<div class="bg-error-container/80 backdrop-blur-sm border border-error/20 rounded-lg p-stack-md mb-stack-lg flex items-start gap-3">
<span class="material-symbols-outlined text-error mt-0.5">error</span>
<div>
<p class="font-label-md text-label-md text-on-error-container mb-1">Error de autenticación</p>
<p class="font-body-sm text-body-sm text-on-error-container/80">{{ error }}</p>
</div>
</div>
{% endif %}
<form action="/login" class="space-y-stack-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="usuario">Usuario</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant/50 rounded-xl bg-white/50 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent focus:bg-white shadow-inner transition-all duration-200" id="usuario" name="usuario" placeholder="Ingrese su usuario" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="contrasena">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant/50 rounded-xl bg-white/50 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent focus:bg-white shadow-inner transition-all duration-200" id="contrasena" name="contrasena" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="pt-stack-sm">
<button class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-md font-headline-md text-headline-md text-on-primary bg-gradient-to-r from-primary to-primary-container hover:from-on-primary-fixed-variant hover:to-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98] transition-all duration-300" type="submit">
                    Entrar
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">© 2026 FarmaControl. Todos los derechos reservados.</p>
</div>
</div>
</body></html>
